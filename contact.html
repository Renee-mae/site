<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <header>
      <div class="logo">
        <h1>🛒ReneeMart</h1>
      </div>

      <nav>
        <a href="index.html">Home</a>

        <a href="products.html">Products</a>

        <a href="cart.html">
          <i class="fa-solid fa-cart-shopping"></i>
          Cart
        </a>

        <a href="register.html">Register</a>

        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <section class="contact-section">
      <h2>Contact ReneeMart</h2>

      <p>
        Have questions, suggestions, or need help with your order? Our team is
        ready to assist you.
      </p>

      <div class="contact-container">
        <!-- Contact Information -->

        <div class="contact-info">
          <h3>Get In Touch</h3>

          <p>
            <i class="fa-solid fa-phone"></i>
            +233 598 044 663
          </p>

          <p>
            <i class="fa-solid fa-envelope"></i>
            support@reneemart.com
          </p>

          <p>
            <i class="fa-solid fa-location-dot"></i>
            Accra, Ghana
          </p>

          <a href="https://wa.me/233598044663" target="_blank" class="whatsapp">
            <i class="fa-brands fa-whatsapp"></i>

            Chat on WhatsApp
          </a>
        </div>

        <!-- Contact Form -->

        <div class="contact-form">
          <h3>Send Message</h3>

          <form>
            <input type="text" placeholder="Your Name" required />

            <input type="email" placeholder="Your Email" required />

            <input type="text" placeholder="Subject" />

            <textarea placeholder="Your Message"></textarea>

            <button type="submit">Send Message</button>
          </form>
        </div>
      </div>
    </section>

    <footer>
      <p>©2026 ReneeMart. All Rights Reserved.</p>
    </footer>
  </body>
</html>
